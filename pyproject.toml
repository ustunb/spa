[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-preference-aggregation"
version = "0.0.1"
authors = [
  { name="Shreyas Kadekodi", email="skadekodi@ucsd.edu" },
  { name="Hayden Mctavish" },
  { name="Berk Ustun" },
]
description = "A short description of your project."
readme = "README.md"
requires-python = ">=3.7"
[tool.setuptools]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/ustunb/spa"
"Bug Tracker" = "https://github.com/ustunb/spa/issues"

packages = ["spa"]
